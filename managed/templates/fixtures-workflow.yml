name: Starter kit fixtures
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 managed/scripts/tests/test_guard_destructive.py
      - run: python3 managed/scripts/tests/test_screen_external.py
      - run: python3 managed/scripts/tests/test_reliability.py
      - run: git diff --check
